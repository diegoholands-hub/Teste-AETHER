name: Build AERIS Pilot APK
on:
  push:
    branches: [kyufo-pilot-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build real Android APK
        working-directory: kyufo-pilot
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Rename APK
        run: cp kyufo-pilot/app/build/outputs/apk/debug/app-debug.apk AERIS-Pilot-v0.1.0.apk
      - name: Publish direct APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aeris-pilot-v0.1.0 --yes 2>/dev/null || true
          gh release create aeris-pilot-v0.1.0 AERIS-Pilot-v0.1.0.apk --target "$GITHUB_SHA" --title "AERIS Pilot v0.1.0 — Android APK" --notes "Build experimental. Protocolo KY UFO/RTSP e FLOW-WIFI; voo em hardware nao validado; modo assistido por regras nao e IA autonoma." --latest=false
