name: Compilar APK LUME PDF

on:
  push:
    branches: [lume-pdf]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK instalável
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar Android SDK e instalar API 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LUME-PDF-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
