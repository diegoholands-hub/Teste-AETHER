plugins { id 'com.android.application' }
android {
    namespace 'br.com.aeris.drone'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.aeris.drone'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies { implementation 'org.videolan.android:libvlc-all:3.6.5' }
